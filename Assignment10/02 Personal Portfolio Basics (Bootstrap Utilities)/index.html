<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="bg-dark text-white text-center p-5">

    <div class="container">

        <h1 class="fw-bold">
            Atul Garg
        </h1>

        <p class="lead mb-0">
            Data Science Student & Future Data Analyst
        </p>

    </div>

</header>

<main>

<section class="container mt-4">

    <div class="text-center">

        <img
            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80"
            class="img-fluid rounded-circle profile-img"
            alt="Profile photo">

        <h2 class="mt-4 fw-bold">
            Hello, I'm Atul
        </h2>

        <p class="text-dark">
            I am passionate about Data Science, Web Development
            and creating useful technology solutions.
        </p>

        <div class="mb-3">

            <a href="#" class="btn btn-primary me-2">
                Hire Me
            </a>

            <a href="#" class="btn btn-outline-dark">
                Download CV
            </a>

        </div>

    </div>

    <div class="row justify-content-center mt-5">

        <div class="col-md-7">

            <div class="bg-light p-5 rounded shadow-sm">

                <h3 class="text-center fw-bold mb-4">
                    Contact Me
                </h3>

                <form>

                    <input
                        type="text"
                        class="form-control mb-3"
                        placeholder="Your Name">

                    <input
                        type="email"
                        class="form-control mb-3"
                        placeholder="Your Email">

                    <textarea
                        class="form-control mb-3"
                        rows="4"
                        placeholder="Your Message"></textarea>

                    <button class="btn btn-primary w-100">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>

</main>

<footer class="text-center bg-dark text-white p-3 mt-5">

    <p class="mb-0">
        &copy; 2026 Atul Garg
    </p>

</footer>

</body>
</html>
