<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="bg-dark text-white text-center py-4">

    <h1>Tech Store</h1>

    <p class="mb-0">
        Quality products at great prices
    </p>

</header>

<main>

<section class="container py-5">

    <h2 class="text-center fw-bold mb-5">
        Our Products
    </h2>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">

            <div class="card product-card shadow-sm h-100">

                <img
                    src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
                    class="card-img-top"
                    alt="Headphones">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Wireless Headphones
                    </h5>

                    <p class="fw-bold">
                        $59
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-md-3">

            <div class="card product-card shadow-sm h-100">

                <img
                    src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                    class="card-img-top"
                    alt="Smart Watch">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Smart Watch
                    </h5>

                    <p class="fw-bold">
                        $89
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-md-3">

            <div class="card product-card shadow-sm h-100">

                <img
                    src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=500&q=80"
                    class="card-img-top"
                    alt="Laptop">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Laptop
                    </h5>

                    <p class="fw-bold">
                        $799
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

        <div class="col-12 col-sm-6 col-md-3">

            <div class="card product-card shadow-sm h-100">

                <img
                    src="https://images.unsplash.com/photo-1585386959984-a41552231693?auto=format&fit=crop&w=500&q=80"
                    class="card-img-top"
                    alt="Smartphone">

                <div class="card-body text-center">

                    <h5 class="card-title">
                        Smartphone
                    </h5>

                    <p class="fw-bold">
                        $499
                    </p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

    </div>

</section>

</main>

<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        &copy; 2026 Tech Store
    </p>

</footer>

</body>
</html>
